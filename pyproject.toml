[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = [
    'E203',  # ignore whitespace after '('
    'W503',  # ignore line break before binary operator
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false